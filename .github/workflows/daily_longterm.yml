name: Daily Stock Recommender - Long Term

on:
  schedule:
    # 08:30 IST = 03:00 UTC
    - cron: '0 3 * * 1-5'
    # Backup run at 08:45 IST in case GitHub delays the first run
    - cron: '15 3 * * 1-5'
  workflow_dispatch:

jobs:
  recommend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance feedparser pandas numpy requests

      - name: Run long-term recommender
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STOCK_RECOMMENDER_MODE: PREMARKET
        run: |
          python stock_recommender_v7.py
