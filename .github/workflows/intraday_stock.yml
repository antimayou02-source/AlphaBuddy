name: Daily Stock Recommender - Intraday

on:
  schedule:
    # 09:45 IST = 04:15 UTC. GitHub Actions may start a few minutes late.
    - cron: '15 4 * * 1-5'
  workflow_dispatch:

jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance feedparser pandas numpy requests

      - name: Run intraday recommender
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STOCK_RECOMMENDER_MODE: INTRADAY
        run: python stock_recommender_v7.py
